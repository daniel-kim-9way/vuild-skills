# 동화 예시 모음
#
# - 저작권이 끝난 옛이야기(이솝 우화·전래동화·그림 형제·안데르센·『벨벳 토끼』)는 줄거리 구조를 빌렸다.
#   무섭거나 벌주는 결말은 바꿨다.
# - 나머지는 그림책에 흔한 주제만 잡고 줄거리와 문장은 새로 썼다. 시중 그림책 문장은 옮기지 않았다.
# - {아이…}는 아이 이름, {친구…}는 첫 번째 인형 이름으로 바뀐다. 조사는 받침에 맞춰 자동으로 고른다.
#   쓸 수 있는 꼴: {아이} {아이는} {아이가} {아이를} {아이와} {아이의} {아이야} {아이도} {아이에게}
#                  {친구} {친구는} {친구가} {친구를} {친구와} {친구의} {친구야} {친구도} {친구에게}
# - scene은 app/models/scene.rb 의 장면 이름이다.

themes:
  - { key: courage,    emoji: "🦁", label: "용기 내기",        desc: "무섭고 떨리는 일을 한 걸음씩 해 봐요" }
  - { key: friendship, emoji: "🤝", label: "친구랑 함께",      desc: "같이 하면 더 커지는 이야기" }
  - { key: sharing,    emoji: "🎁", label: "나누고 돕기",      desc: "내 것을 나누면 마음이 따뜻해져요" }
  - { key: honesty,    emoji: "💎", label: "솔직하게 말하기",  desc: "사실대로 말하면 마음이 가벼워져요" }
  - { key: patience,   emoji: "🐢", label: "기다리고 꾸준히",  desc: "천천히 가도 멈추지 않으면 돼요" }
  - { key: feelings,   emoji: "🌈", label: "마음 알아주기",    desc: "화나고 슬프고 샘나는 마음 다루기" }
  - { key: self,       emoji: "⭐", label: "나는 나라서 좋아", desc: "남과 달라도 내 모습 그대로 소중해요" }
  - { key: bedtime,    emoji: "🌙", label: "잠자리 이야기",    desc: "포근하게 잠드는 이야기" }
  - { key: toys,       emoji: "🧸", label: "장난감이 살아나요", desc: "인형과 장난감이 움직이는 이야기" }
  - { key: adventure,  emoji: "🚀", label: "상상 모험",        desc: "어디든 갔다가 집으로 돌아와요" }
  - { key: habits,     emoji: "🪥", label: "생활 습관",        desc: "이 닦기, 골고루 먹기를 재미있게" }
  - { key: nature,     emoji: "🌱", label: "자연과 계절",      desc: "숲과 바람과 계절 이야기" }

patterns:
  # ───────────── 용기 내기 ─────────────
  - key: night-sounds
    theme: courage
    title: "{아이와} {친구의} 밤 소리 탐험"
    lesson: "무서운 건 잘 몰라서 그래요. 알고 나면 덜 무서워요."
    source: "새로 씀 (주제: 어둠이 무서운 마음)"
    questions:
      - "밤에 들리는 소리 중에 뭐가 제일 궁금해?"
      - "무서울 때 {친구가} 옆에 있으면 어떤 기분이야?"
    pages:
      - { scene: bedroom, text: "불을 끄자 방이 깜깜해졌어요. {아이는} 이불을 머리끝까지 끌어 올렸어요." }
      - { scene: bedroom, text: "사각사각, 똑똑. 어디선가 소리가 났어요. “{친구야}, 저게 무슨 소리야?”" }
      - { scene: bedroom, text: "{친구가} 작은 손전등을 꼭 쥐었어요. “우리 같이 가 볼까? 둘이면 덜 무서워.”" }
      - { scene: bedroom, text: "사각사각 소리는 창밖 나뭇잎이 바람에 스치는 소리였어요. “아, 나뭇잎이 인사하는 거였구나.”" }
      - { scene: kitchen, text: "똑똑 소리는 부엌 수도꼭지에서 물방울이 떨어지는 소리였어요. 똑, 똑, 똑. 꼭 노래 같았어요." }
      - { scene: night,   text: "창밖에서 부엉부엉 소리도 들렸어요. 나무 위 부엉이가 달님에게 밤 인사를 하고 있었어요." }
      - { scene: bedroom, text: "{아이는} 다시 이불 속으로 쏙 들어갔어요. 이제 어떤 소리도 무섭지 않았어요." }
      - { scene: bedroom, text: "“잘 자, 나뭇잎아. 잘 자, 물방울아. 잘 자, 부엉아.” {아이와} {친구는} 꼭 붙어서 잠이 들었어요." }

  - key: first-day
    theme: courage
    title: "{아이의} 첫 등원 날"
    lesson: "처음은 누구나 떨려요. 한 걸음만 내디디면 친구가 생겨요."
    source: "새로 씀 (주제: 처음 가는 곳이 떨리는 마음)"
    questions:
      - "처음 가는 곳에서 제일 떨리는 건 뭐야?"
      - "내일은 누구한테 먼저 손을 흔들어 볼까?"
    pages:
      - { scene: home, text: "내일은 {아이가} 새 유치원에 가는 날이에요. 가방을 메 보니 가슴이 콩닥콩닥 뛰었어요." }
      - { scene: home, text: "“나 혼자 가면 어떡하지?” 그러자 {친구가} 가방 앞주머니에 쏙 들어가며 말했어요. “내가 여기 있을게.”" }
      - { scene: park, text: "유치원 문 앞에 서니 {아이는} 발이 땅에 붙은 것 같았어요. 안에서 아이들 웃음소리가 크게 들렸어요." }
      - { scene: park, text: "{친구가} 주머니 속에서 속삭였어요. “한 걸음만. 딱 한 걸음만 가 보자.”" }
      - { scene: park, text: "{아이는} 숨을 크게 쉬고 한 걸음 걸었어요. 또 한 걸음. 어느새 교실 안이었어요." }
      - { scene: home, text: "블록 놀이를 하던 친구가 {아이를} 보고 손을 흔들었어요. “너도 같이 쌓을래?”" }
      - { scene: home, text: "둘이 쌓은 탑이 키보다 높아졌어요. 와르르 무너져도 둘 다 깔깔 웃었어요." }
      - { scene: home, text: "집에 오는 길에 {친구가} 물었어요. “내일도 갈 거야?” {아이는} 고개를 끄덕였어요. “응, 내일은 내가 먼저 손 흔들 거야!”" }

  - key: tall-slide
    theme: courage
    title: "{아이와} 높은 미끄럼틀"
    lesson: "큰일도 작게 나누면 할 수 있어요."
    source: "새로 씀 (주제: 무서운 일을 한 칸씩 해 보기)"
    questions:
      - "요즘 해 보고 싶은데 조금 무서운 게 있어?"
      - "그걸 첫 칸만 해 본다면 뭐부터 할까?"
    pages:
      - { scene: park, text: "놀이터에 아주 높은 미끄럼틀이 있었어요. {아이는} 맨 위를 올려다보기만 했어요." }
      - { scene: park, text: "“저기서 내려오면 바람이 얼굴에 슝 하고 닿는대.” {친구가} 말했어요. “한번 타 볼래?”" }
      - { scene: park, text: "“너무 높아.” {아이가} 고개를 저었어요. {친구가} 웃으며 말했어요. “그럼 첫 칸까지만 올라가 보자.”" }
      - { scene: park, text: "첫 칸은 쉬웠어요. “이번엔 둘째 칸까지!” 한 칸, 또 한 칸. {아이는} 손잡이를 꼭 잡고 올라갔어요." }
      - { scene: park, text: "어느새 맨 위였어요. 아래를 보니 무릎이 살짝 떨렸어요. {친구가} {아이} 무릎에 앉았어요. “같이 내려가자.”" }
      - { scene: park, text: "하나, 둘, 셋! 슈우웅! 바람이 얼굴에 닿고 머리카락이 날렸어요." }
      - { scene: park, text: "바닥에 내려오자 웃음이 터졌어요. “또 탈래! 한 번만 더!”" }
      - { scene: park, text: "그날 {아이는} 미끄럼틀을 열 번이나 탔어요. 높은 미끄럼틀이 이제 조금 덜 높아 보였어요." }

  # ───────────── 친구랑 함께 ─────────────
  - key: pull-together
    theme: friendship
    title: "다 같이 영차!"
    lesson: "혼자서는 작아도 같이 하면 커져요."
    source: "그림 형제 「브레멘 음악대」와 전래동화 「팥죽 할멈과 호랑이」에서 작은 힘을 모으는 흐름을 빌림 (둘 다 저작권 끝남)"
    questions:
      - "혼자 하기 힘든 일, 누구랑 같이 하면 좋을까?"
      - "이야기에서 누가 제일 멋진 일을 했어?"
    pages:
      - { scene: garden, text: "마당 나무에 {아이의} 빨간 연이 걸렸어요. 손을 뻗어도, 폴짝 뛰어도 닿지 않았어요." }
      - { scene: garden, text: "{친구가} 달려왔어요. “내가 해 볼게!” 영차, 영차. 그래도 연은 꿈쩍도 안 했어요." }
      - { scene: garden, text: "다람쥐가 나무를 타고 올라갔어요. 하지만 연 줄이 너무 꼬여서 혼자서는 풀 수 없었어요." }
      - { scene: garden, text: "참새도 날아와서 콕콕 쪼아 봤어요. 줄은 그대로였어요. 모두 나무 아래 털썩 주저앉았어요." }
      - { scene: garden, text: "{아이가} 벌떡 일어났어요. “혼자서는 안 되지만, 다 같이 하면 되지 않을까?”" }
      - { scene: garden, text: "다람쥐는 가지를 붙잡고, 참새는 엉킨 줄 끝을 물고, {아이와} {친구는} 아래에서 줄을 살살 당겼어요." }
      - { scene: garden, text: "“하나, 둘, 셋, 영차!” 스르륵, 엉킨 줄이 풀리고 연이 {아이} 품으로 떨어졌어요." }
      - { scene: meadow, text: "그날 오후, 빨간 연이 하늘 높이 날았어요. 연 줄은 모두가 한 번씩 돌아가며 잡았어요." }

  - key: tiny-helper
    theme: friendship
    title: "작은 개미의 큰 도움"
    lesson: "작은 친구도 큰 도움을 줄 수 있어요. 친절은 돌아와요."
    source: "이솝 우화 「사자와 생쥐」의 흐름을 빌림 (저작권 끝남)"
    questions:
      - "작아도 잘할 수 있는 일에는 뭐가 있을까?"
      - "누가 너를 도와준 적 있어? 그때 기분이 어땠어?"
    pages:
      - { scene: park, text: "비 온 뒤 놀이터에 작은 물웅덩이가 생겼어요. 개미 한 마리가 웅덩이 앞에서 발을 동동 굴렀어요." }
      - { scene: park, text: "“개미야, 건너고 싶구나?” {아이는} 나뭇잎 하나를 주워 웅덩이 위에 다리처럼 놓아 주었어요." }
      - { scene: park, text: "개미가 나뭇잎 다리를 총총 건넜어요. “고마워! 나도 언젠가 꼭 도와줄게!” {친구가} 킥킥 웃었어요. “저렇게 작은데?”" }
      - { scene: park, text: "조금 뒤, {친구가} 아끼는 반짝이 구슬이 톡 떨어졌어요. 구슬은 보도블록 틈으로 쏙 들어가 버렸어요." }
      - { scene: park, text: "틈이 너무 좁아서 손가락도 안 들어갔어요. {친구는} 눈물이 그렁그렁했어요." }
      - { scene: park, text: "그때 아까 그 개미가 나타났어요. “내가 친구들을 불러 올게!” 개미 열 마리가 줄지어 틈으로 들어갔어요." }
      - { scene: park, text: "영차, 영차. 개미들이 구슬을 굴려서 밖으로 밀어 올렸어요. 구슬이 햇빛에 반짝 빛났어요." }
      - { scene: park, text: "{친구가} 개미들에게 꾸벅 인사했어요. “작다고 놀려서 미안해. 정말 고마워!” 개미들이 더듬이를 흔들며 웃었어요." }

  - key: long-neck
    theme: friendship
    title: "목이 긴 새 친구"
    lesson: "생김새가 달라도 같이 놀 수 있어요. 다른 점이 재미있는 점이에요."
    source: "새로 씀 (주제: 나와 다르게 생긴 친구)"
    questions:
      - "친구랑 너는 어떤 점이 달라?"
      - "그 다른 점 덕분에 더 재미있었던 적 있어?"
    pages:
      - { scene: meadow, text: "들판에 새 친구가 이사 왔어요. 목이 아주 긴 아기 기린이었어요." }
      - { scene: meadow, text: "다른 동물들은 멀찍이서 수군거렸어요. “목이 너무 길다.” “우리랑 못 놀겠다.” 아기 기린은 고개를 푹 숙였어요." }
      - { scene: meadow, text: "{아이는} 아기 기린에게 다가갔어요. “안녕, 나는 {아이}야. 같이 숨바꼭질할래?”" }
      - { scene: meadow, text: "숨바꼭질을 하는데 아기 기린이 친구들을 금방금방 찾아냈어요. 긴 목으로 덤불 너머까지 다 보였거든요." }
      - { scene: meadow, text: "“와, 기린이 술래면 아무도 못 숨겠다!” 수군대던 동물들도 깔깔 웃었어요." }
      - { scene: garden, text: "이번엔 높은 나무에 열린 사과를 따고 싶었어요. 아기 기린이 목을 쭉 뻗어 사과를 하나씩 내려 주었어요." }
      - { scene: meadow, text: "{친구가} 말했어요. “기린은 우리랑 달라서 더 재미있어.” 동물들이 고개를 끄덕였어요." }
      - { scene: meadow, text: "해가 질 때까지 다 같이 놀았어요. 아기 기린의 긴 목 위로 노을이 예쁘게 걸렸어요." }

  # ───────────── 나누고 돕기 ─────────────
  - key: secret-cookies
    theme: sharing
    title: "몰래 나눈 쿠키"
    lesson: "내 것을 나누면 둘 다 넉넉해져요."
    source: "전래동화 「의좋은 형제」의 흐름을 빌림 (저작권 끝남)"
    questions:
      - "{친구에게} 나눠 주고 싶은 게 있어?"
      - "누가 나한테 몰래 뭘 나눠 주면 기분이 어떨까?"
    pages:
      - { scene: home, text: "{아이와} {친구는} 쿠키를 똑같이 나눴어요. 바구니 하나에 다섯 개씩이었어요." }
      - { scene: bedroom, text: "밤이 되자 {아이가} 생각했어요. “{친구는} 오늘 나랑 열심히 놀아서 배가 고플 거야.”" }
      - { scene: home, text: "{아이는} 살금살금 나가서 자기 쿠키 하나를 {친구} 바구니에 넣었어요." }
      - { scene: home, text: "조금 뒤 {친구도} 살금살금 나왔어요. “{아이는} 쑥쑥 크려면 많이 먹어야 해.” {친구는} 자기 쿠키 하나를 {아이} 바구니에 넣었어요." }
      - { scene: home, text: "아침에 세어 보니 바구니마다 쿠키가 그대로 다섯 개씩이었어요. “어? 이상하다.” 둘은 고개를 갸웃했어요." }
      - { scene: home, text: "그날 밤, 둘은 또 몰래 나왔어요. 그리고 깜깜한 거실 한가운데서 쿵 하고 마주쳤어요." }
      - { scene: home, text: "서로 손에 든 쿠키를 보고 둘은 그제야 알았어요. “너도 나한테 주려고 했구나!”" }
      - { scene: home, text: "{아이와} {친구는} 한참 웃었어요. 그리고 마주 앉아 쿠키를 하나씩 나눠 먹었어요. 그 쿠키가 제일 달았어요." }

  - key: star-dust
    theme: sharing
    title: "별 가루가 내린 밤"
    lesson: "추운 친구에게 내 것을 나누면 마음이 따뜻해져요."
    source: "그림 형제 「별 은화」의 흐름을 빌림 (저작권 끝남). 가난하고 외로운 장면은 뺐음"
    questions:
      - "목도리를 벗어 준 {아이는} 어떤 마음이었을까?"
