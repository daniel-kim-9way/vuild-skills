      - "섬에 가면 누구를 만나고 싶어?"
    pages:
      - { scene: bathroom, text: "{아이가} 욕조에 종이배를 띄웠어요. {친구가} 종이배에 쏙 올라탔어요. “출발!”" }
      - { scene: beach, text: "그러자 종이배가 쑥쑥 커지더니 욕조 물이 넓은 바다가 되었어요. {아이도} 배에 훌쩍 올라탔어요." }
      - { scene: beach, text: "바다 위로 물고기들이 퐁퐁 뛰어올랐어요. 갈매기가 끼룩끼룩 길을 알려 주었어요." }
      - { scene: beach, text: "배는 작은 섬에 닿았어요. 섬에는 조개껍데기로 만든 집과 모래로 만든 성이 있었어요." }
      - { scene: beach, text: "섬에 사는 꼬마 게가 집게발을 흔들었어요. “어서 와! 같이 모래성 쌓을래?”" }
      - { scene: beach, text: "셋은 모래성에 탑을 세우고 조개로 창문을 달았어요. 파도가 와도 끄떡없는 튼튼한 성이었어요." }
      - { scene: sky, text: "노을이 지자 {친구가} 말했어요. “이제 집에 갈 시간이야.” 꼬마 게가 분홍 조개 하나를 선물로 주었어요." }
      - { scene: bathroom, text: "“{아이야}, 목욕 끝났니?” 엄마 목소리에 바다가 다시 욕조가 되었어요. 그런데 {아이} 손에는 분홍 조개가 쥐어져 있었어요." }

  - key: block-moon
    theme: adventure
    title: "블록 계단으로 달님까지"
    lesson: "하고 싶은 게 있으면 하나씩 쌓아 가면 돼요."
    source: "새로 씀 (주제: 달에 가 보는 상상)"
    questions:
      - "달님을 만나면 뭘 물어보고 싶어?"
      - "블록으로 또 어디까지 가 볼까?"
    pages:
      - { scene: bedroom, text: "창밖에 동그란 달이 떴어요. “{친구야}, 달님 만나러 가 볼까?” {아이가} 블록 통을 쏟았어요." }
      - { scene: bedroom, text: "한 칸, 두 칸, 블록을 쌓았어요. 블록 계단은 천장을 지나 지붕 위로 쑥쑥 올라갔어요." }
      - { scene: night, text: "구름을 지나고, 잠자는 새들을 지나고, 반짝이는 별들 사이로 계단이 이어졌어요." }
      - { scene: night, text: "“힘들어.” {친구가} 헉헉거렸어요. {아이가} 손을 내밀었어요. “조금만 더! 거의 다 왔어.”" }
      - { scene: night, text: "드디어 달에 닿았어요. 달님이 하품을 하며 눈을 떴어요. “어머, 손님이 왔네?”" }
      - { scene: night, text: "달님은 둘을 등에 태우고 밤하늘을 한 바퀴 돌았어요. 저 아래 우리 집 지붕이 콩알만 하게 보였어요." }
      - { scene: night, text: "“이제 집에 가야 해요. 또 놀러 올게요.” 달님이 은빛 미끄럼틀을 쭉 내려 주었어요." }
      - { scene: bedroom, text: "슝, 미끄럼틀을 타고 내려오니 침대 위였어요. 창밖 달님이 찡긋 윙크를 하는 것 같았어요." }

  - key: book-sea
    theme: adventure
    title: "그림책 속 바다"
    lesson: "길 잃은 친구를 도우면 나도 새 친구가 생겨요."
    source: "새로 씀 (주제: 그림책 속으로 들어가는 상상)"
    questions:
      - "엄마 문어는 아기를 어떻게 찾았을까?"
      - "그림책 속에 들어간다면 어떤 책으로 가고 싶어?"
    pages:
      - { scene: bedroom, text: "{아이가} 바다 그림책을 펼치자 책 속에서 철썩철썩 파도 소리가 들렸어요. {아이와} {친구는} 책 속으로 쏙 빨려 들어갔어요." }
      - { scene: underwater, text: "바닷속은 파랗고 고요했어요. 알록달록한 물고기들이 둘 사이를 스르르 지나갔어요." }
      - { scene: underwater, text: "산호 뒤에서 아기 문어가 훌쩍이고 있었어요. “엄마를 잃어버렸어요.”" }
      - { scene: underwater, text: "“엄마는 어떻게 생겼어?” {아이가} 묻자 아기 문어가 말했어요. “다리가 여덟 개고, 노래를 좋아해요.”" }
      - { scene: underwater, text: "셋은 귀를 기울였어요. 저 멀리서 보글보글 노랫소리가 들렸어요. “이쪽이야!”" }
      - { scene: underwater, text: "커다란 바위 뒤에서 엄마 문어가 아기를 부르며 노래하고 있었어요. “엄마!” 아기 문어가 쏙 안겼어요." }
      - { scene: underwater, text: "엄마 문어가 여덟 개 다리로 {아이와} {친구를} 한꺼번에 꼭 안아 주었어요. “고맙다, 꼬마 손님들.”" }
      - { scene: bedroom, text: "눈을 깜빡이니 다시 방이었어요. 그림책 사이에 분홍 조개 책갈피가 끼워져 있었어요." }

  # ───────────── 생활 습관 ─────────────
  - key: tooth-party
    theme: habits
    title: "충치 벌레가 이사 가요"
    lesson: "이를 닦으면 입안이 상쾌하고 이가 튼튼해져요."
    source: "새로 씀 (주제: 이 닦기)"
    questions:
      - "치카치카 노래 같이 불러 볼까?"
      - "어느 쪽 이부터 닦을까? 위? 아래?"
    pages:
      - { scene: kitchen, text: "{아이는} 달콤한 사탕을 먹고 그냥 자려고 했어요. “이 닦기 귀찮아.”" }
      - { scene: bathroom, text: "{친구가} {아이} 입안을 들여다보았어요. “어? 이 사이에서 누가 파티를 하는데?”" }
      - { scene: bathroom, text: "꼬마 충치 벌레들이 사탕 부스러기로 잔치를 벌이고 있었어요. “냠냠, 여기다 집 짓고 살자!”" }
      - { scene: bathroom, text: "“안 돼! 우리 이는 너희 집이 아니야.” {아이가} 칫솔을 들었어요. {친구가} 치약을 콩알만큼 짜 주었어요." }
      - { scene: bathroom, text: "치카치카 위쪽, 치카치카 아래쪽, 안쪽도 구석구석. 거품이 보글보글 일었어요." }
      - { scene: bathroom, text: "“으악, 너무 상쾌해!” 충치 벌레들이 짐을 싸서 허둥지둥 떠났어요. “다른 데로 이사 가자!”" }
      - { scene: bathroom, text: "물로 가글가글 헹구고 거울을 보니 이가 반짝반짝 빛났어요. “이것 봐, 별처럼 빛나!”" }
      - { scene: bedroom, text: "그날부터 {아이와} {친구는} 자기 전에 꼭 이를 닦아요. 치카치카 노래를 부르면서요." }

  - key: rainbow-table
    theme: habits
    title: "무지개 밥상"
    lesson: "여러 색 음식을 먹으면 몸에 힘이 나요."
    source: "새로 씀 (주제: 골고루 먹기)"
    questions:
      - "오늘 밥상에는 무슨 색이 있었어?"
      - "보라색 음식은 뭐가 있을까?"
    pages:
      - { scene: kitchen, text: "저녁 밥상에 초록 브로콜리가 올라왔어요. {아이는} 브로콜리를 접시 끝으로 슬쩍 밀어 놓았어요." }
      - { scene: kitchen, text: "“초록색은 맛없어 보여.” 그러자 {친구가} 말했어요. “우리 무지개 밥상 놀이 할래?”" }
      - { scene: kitchen, text: "“빨간색은 뭐가 있지?” “토마토!” {아이가} 토마토를 한 입 먹었어요. 새콤달콤했어요." }
      - { scene: kitchen, text: "“주황색은?” “당근!” 아삭아삭 소리가 났어요. “노란색은?” “옥수수!” 톡톡 터졌어요." }
      - { scene: kitchen, text: "“이제 초록색 차례야.” {아이는} 브로콜리를 쳐다봤어요. 꼭 작은 나무 같았어요." }
      - { scene: kitchen, text: "“나는 거인이다! 나무를 한입에!” {아이가} 브로콜리를 앙 먹었어요. 생각보다 고소했어요." }
      - { scene: kitchen, text: "접시에 여러 빛깔이 다 모였어요. {친구가} 박수를 쳤어요. “무지개 밥상 완성!”" }
      - { scene: kitchen, text: "다 먹고 나니 배가 든든하고 다리에 힘이 불끈 났어요. “내일은 보라색도 찾아보자!”" }

  # ───────────── 자연과 계절 ─────────────
  - key: wind-and-sun
    theme: nature
    title: "바람과 해님의 내기"
    lesson: "억지로 하는 것보다 따뜻하게 대하면 마음이 열려요."
    source: "이솝 우화 「북풍과 해님」의 흐름을 빌림 (저작권 끝남)"
    questions:
      - "바람과 해님 중에 누가 더 좋아?"
      - "친구가 내 말을 안 들어줄 때 어떻게 하면 좋을까?"
    pages:
      - { scene: meadow, text: "언덕 위에서 바람과 해님이 내기를 했어요. “저기 {아이가} 쓴 노란 모자를 누가 먼저 벗기나 해 보자!”" }
      - { scene: meadow, text: "바람이 먼저 후우우 세게 불었어요. {아이는} 모자를 두 손으로 꽉 붙잡았어요." }
      - { scene: meadow, text: "바람이 세게 불수록 {아이는} 모자를 더 꾹 눌러썼어요. {친구도} {아이} 다리에 꼭 매달렸어요." }
      - { scene: meadow, text: "“휴, 힘들다.” 지친 바람이 물러났어요. 이번엔 해님 차례예요." }
      - { scene: meadow, text: "해님은 방긋 웃으며 따뜻한 햇살을 비춰 주었어요. 들판이 포근해지고 꽃들이 고개를 들었어요." }
      - { scene: meadow, text: "“아이, 더워.” {아이는} 스스로 모자를 벗어 부채질을 했어요. {친구도} 풀밭에 벌러덩 누웠어요." }
      - { scene: sky, text: "바람이 해님에게 물었어요. “어떻게 한 거야?” 해님이 말했어요. “억지로 하지 않고 따뜻하게 해 줬을 뿐이야.”" }
      - { scene: meadow, text: "그 뒤로 바람도 살랑살랑 부드럽게 불었어요. {아이와} {친구는} 그 바람에 비눗방울을 날렸어요." }

  - key: winter-song
    theme: nature
    title: "개미와 베짱이의 겨울 노래"
    lesson: "저마다 잘하는 걸 나누면 겨울도 따뜻해요."
    source: "이솝 우화 「개미와 베짱이」의 흐름을 빌림 (저작권 끝남). 내쫓는 결말을 함께 나누는 결말로 바꿈"
    questions:
      - "개미는 왜 문을 열어 줬을까?"
      - "너는 친구들한테 뭘 나눠 줄 수 있어?"
    pages:
      - { scene: meadow, text: "여름 들판에서 개미들은 부지런히 먹이를 날랐어요. 베짱이는 나무 그늘에서 바이올린을 켰어요." }
      - { scene: meadow, text: "{아이와} {친구는} 둘 다 좋았어요. 개미들 짐을 같이 들어 주고, 베짱이 노래에 맞춰 춤도 췄어요." }
      - { scene: snow, text: "겨울이 오자 들판이 하얗게 덮였어요. 베짱이는 배가 고프고 추웠어요." }
      - { scene: snow, text: "베짱이가 개미네 문을 똑똑 두드렸어요. “먹을 것을 조금만 나눠 줄 수 있니?”" }
      - { scene: snow, text: "개미들이 고개를 갸웃했어요. 그때 {아이가} 말했어요. “베짱이는 여름 내내 우리한테 노래를 불러 줬잖아.”" }
      - { scene: home, text: "개미들이 문을 활짝 열었어요. “어서 들어와! 대신 노래 한 곡 들려줄래?”" }
      - { scene: home, text: "따뜻한 개미집에서 다 같이 수프를 먹었어요. 베짱이가 바이올린을 켜자 개미들이 박자에 맞춰 발을 굴렀어요." }
      - { scene: home, text: "“먹이는 개미가, 노래는 베짱이가!” {친구가} 외쳤어요. 그해 겨울은 노래가 끊이지 않는 따뜻한 겨울이었어요." }

  - key: forest-picnic
    theme: nature
    title: "숲을 지키는 꼬마"
