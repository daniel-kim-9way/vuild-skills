      - "우리도 산책할 때 뭘 할 수 있을까?"
    pages:
      - { scene: forest, text: "{아이와} {친구는} 가족과 함께 숲으로 소풍을 갔어요. 나무 사이로 햇살이 반짝반짝 쏟아졌어요." }
      - { scene: forest, text: "그런데 길가에 과자 봉지가 떨어져 있었어요. 다람쥐가 봉지에 머리가 끼어 버둥거렸어요." }
      - { scene: forest, text: "{아이가} 조심조심 봉지를 빼 주었어요. 다람쥐가 휴우 숨을 쉬었어요. “고마워, 앞이 하나도 안 보였어.”" }
      - { scene: forest, text: "“숲에 이런 게 또 있을지도 몰라.” {아이와} {친구는} 봉투를 들고 쓰레기 줍기 탐험을 떠났어요." }
      - { scene: forest, text: "병뚜껑, 사탕 껍질, 빨대까지. 봉투가 금방 불룩해졌어요. 새들이 머리 위에서 짹짹 응원했어요." }
      - { scene: forest, text: "냇가에 다다르자 물이 맑게 반짝였어요. 물고기들이 꼬리를 흔들며 인사했어요." }
      - { scene: forest, text: "돌아오는 길, 다람쥐가 도토리 하나를 {아이} 손에 올려놓았어요. “숲이 고맙대.”" }
      - { scene: forest, text: "{아이는} 쓰레기 봉투를 꼭 쥐고 집으로 돌아왔어요. “다음 소풍 때도 숲을 깨끗하게 해 주자!”" }
